<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Chill Lounge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0c1b;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e2e8f0;
    user-select: none;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }
  .ui-container {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 2.5rem;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    width: 340px;
    text-align: center;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.25em;
    margin-bottom: 0.4rem;
    color: #f1f5f9;
  }
  p.subtitle {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }
  .btn-play {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none;
    color: white;
    padding: 0.8rem 2.2rem;
    border-radius: 9999px;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    transition: all 0.3s ease;
    margin-bottom: 2rem;
  }
  .btn-play:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    text-align: left;
  }
  .control-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #cbd5e1;
  }
  input[type="range"] {
    appearance: none;
    width: 130px;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #c084fc;
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  .hint {
    position: absolute;
    bottom: 24px;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.35);
    z-index: 2;
    pointer-events: none;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="ui-container">
  <h1>MIDNIGHT CHILL</h1>
  <p class="subtitle">Procedural Sound & Light</p>
  
  <button class="btn-play" id="playBtn">START CHILLING</button>
  
  <div class="control-group">
    <div class="control-item">
      <span>Ambient Synth</span>
      <input type="range" id="synthVol" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div class="control-item">
      <span>Gentle Rain</span>
      <input type="range" id="rainVol" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="control-item">
      <span>Warm Fire</span>
      <input type="range" id="fireVol" min="0" max="1" step="0.01" value="0.2">
    </div>
  </div>
</div>

<div class="hint">画面をクリックすると、波紋とともに静かな音が響きます</div>

<script>
// Canvas Visuals
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 2 + 0.5;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.speedY = -(Math.random() * 0.2 + 0.05);
    this.pulse = Math.random() * 0.02 + 0.005;
  }
  update() {
    this.y += this.speedY;
    this.alpha += Math.sin(Date.now() * this.pulse) * 0.004;
    if (this.y < 0) this.y = height;
  }
  draw() {
    ctx.fillStyle = `rgba(192, 132, 252, ${Math.max(0, this.alpha)})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.alpha = 0.5;
  }
  update() {
    this.radius += 1.5;
    this.alpha -= 0.007;
  }
  draw() {
    ctx.strokeStyle = `rgba(168, 85, 247, ${Math.max(0, this.alpha)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

const particles = Array.from({ length: 80 }, () => new Particle());
const ripples = [];

function animate() {
  ctx.fillStyle = 'rgba(10, 12, 27, 0.25)';
  ctx.fillRect(0, 0, width, height);

  particles.forEach(p => { p.update(); p.draw(); });

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.update();
    r.draw();
    if (r.alpha <= 0) ripples.splice(i, 1);
  }

  requestAnimationFrame(animate);
}
animate();

// Web Audio API Synthesis
let audioCtx = null;
let isPlaying = false;
let synthGain, rainGain, fireGain;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  synthGain = audioCtx.createGain();
  synthGain.gain.value = parseFloat(document.getElementById('synthVol').value);
  synthGain.connect(audioCtx.destination);

  rainGain = audioCtx.createGain();
  rainGain.gain.value = parseFloat(document.getElementById('rainVol').value);
  rainGain.connect(audioCtx.destination);

  fireGain = audioCtx.createGain();
  fireGain.gain.value = parseFloat(document.getElementById('fireVol').value);
  fireGain.connect(audioCtx.destination);

  startAmbientSynth();
  startRainSound();
  startFireSound();
}

// Lo-Fi Chord Progression: Cmaj7 -> Am7 -> Dm7 -> G7
const chords = [
  [261.63, 329.63, 392.00, 493.88],
  [220.00, 261.63, 329.63, 392.00],
  [293.66, 349.23, 440.00, 523.25],
  [196.00, 246.94, 293.66, 349.23]
];
let currentChord = 0;

function startAmbientSynth() {
  setInterval(() => {
    if (!isPlaying || !audioCtx) return;

    const notes = chords[currentChord];
    currentChord = (currentChord + 1) % chords.length;

    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = freq;

      filter.type = 'lowpass';
      filter.frequency.value = 550;

      const now = audioCtx.currentTime;
      noteGain.gain.setValueAtTime(0, now);
      noteGain.gain.linearRampToValueAtTime(0.06, now + 2.5 + idx * 0.2);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 7.5);

      osc.connect(filter);
      filter.connect(noteGain);
      noteGain.connect(synthGain);

      osc.start(now);
      osc.stop(now + 8);
    });
  }, 6500);
}

function startRainSound() {
  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);

  let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
    b6 = white * 0.115926;
  }

  const rainNode = audioCtx.createBufferSource();
  rainNode.buffer = noiseBuffer;
  rainNode.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 750;

  rainNode.connect(filter);
  filter.connect(rainGain);
  rainNode.start();
}

function startFireSound() {
  const bufferSize = audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() < 0.0025 ? (Math.random() * 2 - 1) * 0.4 : 0;
  }

  const fireNode = audioCtx.createBufferSource();
  fireNode.buffer = buffer;
  fireNode.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 2200;

  fireNode.connect(filter);
  filter.connect(fireGain);
  fireNode.start();
}

function playTone(x) {
  if (!audioCtx || !isPlaying) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
  const index = Math.floor((x / width) * scale.length);
  const freq = scale[Math.min(index, scale.length - 1)];

  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 2.5);
}

// UI Controls
document.getElementById('playBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audioCtx) initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  isPlaying = !isPlaying;
  document.getElementById('playBtn').innerText = isPlaying ? 'PAUSE' : 'START CHILLING';
});

document.getElementById('synthVol').addEventListener('input', (e) => { if (synthGain) synthGain.gain.value = parseFloat(e.target.value); });
document.getElementById('rainVol').addEventListener('input', (e) => { if (rainGain) rainGain.gain.value = parseFloat(e.target.value); });
document.getElementById('fireVol').addEventListener('input', (e) => { if (fireGain) fireGain.gain.value = parseFloat(e.target.value); });

window.addEventListener('click', (e) => {
  if (e.target.closest('.ui-container')) return;
  ripples.push(new Ripple(e.clientX, e.clientY));
  playTone(e.clientX);
});
</script>
</body>
</html>
